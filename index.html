<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="1min">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>1min</title>
  <style>
    :root {
      --bg: #f4f6f1;
      --card: rgba(255,255,255,.9);
      --ink: #20251f;
      --muted: #6f776c;
      --line: #dde4da;
      --accent: #5f7758;
      --accent-soft: #e5ece1;
      --shadow: 0 12px 32px rgba(44,58,40,.08);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; min-height:100%; background:var(--bg); color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif; }
    body { padding:max(18px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom)); }
    .app { max-width:560px; margin:0 auto; }
    .top { padding:8px 2px 18px; }
    h1 { margin:0; font-size:31px; letter-spacing:.02em; }
    .tagline { margin-top:7px; font-size:16px; font-weight:700; }
    .date { margin-top:6px; color:var(--muted); font-size:13px; }
    .card { background:var(--card); border:1px solid rgba(255,255,255,.7); border-radius:24px;
      padding:18px; box-shadow:var(--shadow); margin-bottom:14px; backdrop-filter:blur(10px); }
    .subjects { display:grid; gap:12px; }
    .subject { width:100%; border:1px solid var(--line); background:#fff; color:var(--ink);
      border-radius:18px; padding:16px; display:flex; align-items:center; justify-content:space-between;
      font:inherit; font-weight:700; font-size:18px; cursor:pointer; min-height:64px; }
    .subject .left { display:flex; gap:11px; align-items:center; }
    .subject .icon { font-size:23px; }
    .subject .state { font-size:14px; color:var(--muted); font-weight:600; }
    .subject.done { background:var(--accent-soft); border-color:#cbd8c6; }
    .subject.done .state { color:var(--accent); }
    .summary { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
    .summaryBox { background:#fff; border:1px solid var(--line); border-radius:16px; padding:13px; }
    .summaryLabel { color:var(--muted); font-size:12px; margin-bottom:4px; }
    .summaryValue { font-size:20px; font-weight:800; }
    .message { margin:16px 2px 0; color:var(--accent); font-weight:700; text-align:center; min-height:24px; }
    .sectionTitle { font-size:15px; font-weight:800; margin:0 0 12px; }
    .week { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; text-align:center; }
    .day { padding:8px 2px; border-radius:14px; }
    .day.today { background:#fff; outline:1px solid var(--line); }
    .dow { font-size:11px; color:var(--muted); }
    .leaf { font-size:22px; line-height:1.3; margin:3px 0; }
    .num { font-size:11px; color:var(--muted); }
    .actions { display:grid; gap:9px; }
    .action { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:15px;
      padding:13px 14px; font:inherit; font-weight:700; cursor:pointer; text-align:left; }
    .action.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
    .small { font-size:12px; color:var(--muted); line-height:1.55; margin-top:10px; }
    .footer { text-align:center; color:var(--muted); font-size:11px; padding:8px 0 0; }
    dialog { width:min(92vw,500px); border:0; border-radius:22px; padding:0; box-shadow:0 20px 60px rgba(0,0,0,.2); }
    dialog::backdrop { background:rgba(0,0,0,.28); }
    .dialogBody { padding:18px; }
    .dialogBody h2 { margin:0 0 8px; font-size:20px; }
    .nameInput { width:100%; border:1px solid var(--line); border-radius:14px; padding:13px 14px; font:inherit; font-size:17px; }
    .dialogActions { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
    .miniBtn { border:1px solid var(--line); background:#fff; border-radius:12px; padding:10px 12px; font:inherit; font-weight:700; }
    textarea { width:100%; height:220px; resize:none; border:1px solid var(--line); border-radius:12px; padding:10px; font-size:12px; }
    input[type=file] { display:none; }
  </style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>1min</h1>
    <div class="tagline" id="tagline">1分だってチリツモ。</div>
    <div class="date" id="dateText"></div>
  </header>

  <section class="card">
    <div class="subjects">
      <button class="subject" data-subject="japanese" aria-pressed="false">
        <span class="left"><span class="icon">📖</span><span>国語</span></span>
        <span class="state">まだ</span>
      </button>
      <button class="subject" data-subject="math" aria-pressed="false">
        <span class="left"><span class="icon">➗</span><span>数学</span></span>
        <span class="state">まだ</span>
      </button>
      <button class="subject" data-subject="english" aria-pressed="false">
        <span class="left"><span class="icon">🔤</span><span>英語</span></span>
        <span class="state">まだ</span>
      </button>
    </div>

    <div class="summary">
      <div class="summaryBox">
        <div class="summaryLabel">今日</div>
        <div class="summaryValue" id="todayCount">0 / 3</div>
      </div>
      <div class="summaryBox">
        <div class="summaryLabel">連続</div>
        <div class="summaryValue" id="streak">0日</div>
      </div>
    </div>
    <div class="message" id="message">まずは1分。</div>
  </section>

  <section class="card">
    <div class="sectionTitle">最近の7日</div>
    <div class="week" id="week"></div>
  </section>

  <section class="card">
    <div class="sectionTitle">設定・バックアップ</div>
    <div class="actions">
      <button class="action" id="changeName">✏️ 表示名を変える</button>
      <button class="action primary" id="backupJson">💾 バックアップ（JSON）</button>
      <button class="action" id="exportCsv">📊 CSVを書き出す</button>
      <label class="action" for="restoreFile">♻️ バックアップから復元</label>
      <input id="restoreFile" type="file" accept=".json,application/json">
    </div>
    <div class="small" id="backupInfo">最終バックアップ：まだありません</div>
    <div class="small">表示名と学習記録はこのiPhone内に保存されます。公開側には保存されません。</div>
  </section>

  <div class="footer">1min · v0.1</div>
</div>

<dialog id="nameDialog">
  <div class="dialogBody">
    <h2>表示名</h2>
    <div class="small" style="margin:0 0 10px;">この名前はこの端末内だけに保存されます。</div>
    <input id="nameInput" class="nameInput" type="text" maxlength="20" placeholder="表示名">
    <div class="dialogActions">
      <button class="miniBtn" id="saveName">保存</button>
    </div>
  </div>
</dialog>

<dialog id="fallbackDialog">
  <div class="dialogBody">
    <h2>バックアップ内容</h2>
    <div class="small" style="margin:0 0 8px;">共有できない場合は、この内容をコピーして保存できます。</div>
    <textarea id="fallbackText" readonly></textarea>
    <div class="dialogActions">
      <button class="miniBtn" id="copyText">コピー</button>
      <button class="miniBtn" id="closeDialog">閉じる</button>
    </div>
  </div>
</dialog>

<script>
(() => {
  const STORAGE_KEY = 'oneMin.v1';
  const SUBJECTS = ['japanese','math','english'];
  const DOW = ['日','月','火','水','木','金','土'];

  const defaultState = () => ({ version:1, displayName:'', records:{}, lastBackupAt:null });

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      const parsed = JSON.parse(raw);
      return {
        version:1,
        displayName: typeof parsed.displayName === 'string' ? parsed.displayName : '',
        records: parsed.records && typeof parsed.records === 'object' ? parsed.records : {},
        lastBackupAt: parsed.lastBackupAt || null
      };
    } catch { return defaultState(); }
  }

  let state = loadState();
  const saveState = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  const pad = n => String(n).padStart(2,'0');
  const dateKey = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const prettyDate = (d=new Date()) => `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${DOW[d.getDay()]}）`;
  const blankRecord = () => ({japanese:false, math:false, english:false});
  const getRecord = key => Object.assign(blankRecord(), state.records[key] || {});
  const countRecord = rec => SUBJECTS.reduce((n,s)=>n+(rec[s]?1:0),0);
  const hasActivity = key => countRecord(getRecord(key)) > 0;

  function addDays(date, n) {
    const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    d.setDate(d.getDate()+n);
    return d;
  }

  function streakCount() {
    const today = new Date();
    let cursor = hasActivity(dateKey(today)) ? today : addDays(today,-1);
    let n = 0;
    while (hasActivity(dateKey(cursor))) {
      n++;
      cursor = addDays(cursor,-1);
      if (n > 5000) break;
    }
    return n;
  }

  const leafFor = count => count===1 ? '🌱' : count===2 ? '🌿' : count===3 ? '🌳' : '·';
  const messageFor = count => count===1 ? '1分でも、ちゃんと前進。' : count===2 ? 'いい感じ。' : count===3 ? '今日は3つ。' : 'まずは1分。';

  function render() {
    const now = new Date();
    const key = dateKey(now);
    const rec = getRecord(key);
    const count = countRecord(rec);

    document.getElementById('dateText').textContent = prettyDate(now);
    document.getElementById('tagline').textContent =
      state.displayName ? `${state.displayName}さん、1分だってチリツモ。` : '1分だってチリツモ。';

    document.querySelectorAll('.subject').forEach(btn => {
      const sub = btn.dataset.subject;
      const done = !!rec[sub];
      btn.classList.toggle('done', done);
      btn.setAttribute('aria-pressed', done ? 'true' : 'false');
      btn.querySelector('.state').textContent = done ? 'できた！' : 'まだ';
    });

    document.getElementById('todayCount').textContent = `${count} / 3`;
    document.getElementById('streak').textContent = `${streakCount()}日`;
    document.getElementById('message').textContent = messageFor(count);

    const week = document.getElementById('week');
    week.innerHTML = '';
    for (let i=6; i>=0; i--) {
      const d = addDays(now,-i);
      const c = countRecord(getRecord(dateKey(d)));
      const div = document.createElement('div');
      div.className = 'day' + (i===0 ? ' today' : '');
      div.innerHTML = `<div class="dow">${DOW[d.getDay()]}</div><div class="leaf">${leafFor(c)}</div><div class="num">${d.getDate()}</div>`;
      week.appendChild(div);
    }

    const info = document.getElementById('backupInfo');
    if (state.lastBackupAt) {
      const d = new Date(state.lastBackupAt);
      info.textContent = `最終バックアップ：${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    } else {
      info.textContent = '最終バックアップ：まだありません';
    }
  }

  document.querySelectorAll('.subject').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = dateKey();
      const rec = getRecord(key);
      const sub = btn.dataset.subject;
      rec[sub] = !rec[sub];
      state.records[key] = rec;
      saveState();
      render();
      if (navigator.vibrate) navigator.vibrate(20);
    });
  });

  function openNameDialog() {
    document.getElementById('nameInput').value = state.displayName || '';
    document.getElementById('nameDialog').showModal();
  }

  document.getElementById('changeName').addEventListener('click', openNameDialog);
  document.getElementById('saveName').addEventListener('click', () => {
    state.displayName = document.getElementById('nameInput').value.trim();
    saveState();
    document.getElementById('nameDialog').close();
    render();
  });

  function jsonBackupText() {
    return JSON.stringify({
      app:'1min',
      schemaVersion:1,
      exportedAt:new Date().toISOString(),
      displayName:state.displayName,
      records:state.records
    }, null, 2);
  }

  function csvText() {
    const keys = Object.keys(state.records).sort();
    const rows = [['日付','国語','数学','英語','達成数']];
    for (const k of keys) {
      const r = getRecord(k);
      rows.push([k, r.japanese?1:0, r.math?1:0, r.english?1:0, countRecord(r)]);
    }
    return '\uFEFF' + rows.map(row =>
      row.map(v => `"${String(v).replaceAll('"','""')}"`).join(',')
    ).join('\r\n');
  }

  async function shareOrFallback(filename, type, text, kind) {
    const file = new File([text], filename, {type});
    try {
      if (navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))) {
        await navigator.share({title:filename, files:[file]});
        if (kind==='json') {
          state.lastBackupAt = new Date().toISOString();
          saveState(); render();
        }
        return;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }

    try {
      const url = URL.createObjectURL(file);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1500);
      if (kind==='json') {
        state.lastBackupAt = new Date().toISOString();
        saveState(); render();
      }
      return;
    } catch {}

    document.getElementById('fallbackText').value = text;
    document.getElementById('fallbackDialog').showModal();
  }

  document.getElementById('backupJson').addEventListener('click', async () => {
    await shareOrFallback(`1min-backup-${dateKey()}.json`, 'application/json;charset=utf-8', jsonBackupText(), 'json');
  });

  document.getElementById('exportCsv').addEventListener('click', async () => {
    const now = new Date();
    await shareOrFallback(`1min-${now.getFullYear()}-${pad(now.getMonth()+1)}.csv`, 'text/csv;charset=utf-8', csvText(), 'csv');
  });

  document.getElementById('restoreFile').addEventListener('change', async e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      const obj = JSON.parse(await file.text());
      if (!obj || obj.schemaVersion !== 1 || !obj.records || typeof obj.records !== 'object') {
        alert('このバックアップは読み込めませんでした。'); return;
      }
      if (!confirm('現在の記録を、このバックアップの内容で置き換えますか？')) return;
      state.displayName = typeof obj.displayName === 'string' ? obj.displayName : state.displayName;
      state.records = obj.records;
      saveState(); render();
      alert('復元しました。');
    } catch { alert('バックアップファイルを読み込めませんでした。'); }
  });

  document.getElementById('copyText').addEventListener('click', async () => {
    const text = document.getElementById('fallbackText').value;
    try { await navigator.clipboard.writeText(text); alert('コピーしました。'); }
    catch {
      document.getElementById('fallbackText').select();
      document.execCommand('copy');
      alert('コピーしました。');
    }
  });

  document.getElementById('closeDialog').addEventListener('click', () =>
    document.getElementById('fallbackDialog').close()
  );

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
    });
  }

  render();
  if (!state.displayName) setTimeout(openNameDialog, 250);
})();
</script>
</body>
</html>
